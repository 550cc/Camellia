# proot 环境：单 worker、无守护、限制堆（设备空闲内存只有 8G 左右）
# proot 里 pthread_create 会 ENOSYS：必须限制线程数（ActiveProcessorCount/SerialGC/单编译器线程）
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=320m -XX:ActiveProcessorCount=1 -XX:+UseSerialGC -XX:ReservedCodeCacheSize=128m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=37
# proot 里 fork 子进程不稳，Kotlin 编译放主进程
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false

# AGP 自带的 aapt2 是 x86-64，proot 里直接用会 “Daemon startup failed”，
# 改指向 build-tools 35 里已被 QEMU 包装过的 aapt2。
android.aapt2FromMavenOverride=/opt/android-sdk/qemu-wrap/aapt2

# release 变体必须关掉资源优化（opt-res）：在本 proot+QEMU 环境里它会把
# AndroidManifest.xml / resources.arsc / res/** 从最终 APK 里丢掉，
# 产物只剩 dex+so（86 条目），装上去直接「解析包失败」。
# 关掉后 release 包结构才与 debug 一致（134 条目），只少了 PNG 压缩这点体积优化。
android.enableResourceOptimizations=false
